<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270">
  <style>
    .fade { opacity:0; animation: up .8s ease-out forwards; }
    .chip { opacity:0; animation: up .6s ease-out forwards; }
    @keyframes up { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    .spin { transform-origin: 110px 135px; animation: spin 10s linear infinite; }
    .spin2 { transform-origin: 110px 135px; animation: spin 16s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    .type { clip-path: inset(0 100% 0 0); animation: type 2.4s steps(30) .4s forwards; }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 790px 112px; }
    @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1); } 50% { opacity:.9; transform: scale(1.12); } }
  </style>
  <defs>
    <linearGradient id="bgh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="bdh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#a78bfa;#34d399;#38bdf8" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#34d399;#38bdf8;#a78bfa" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="blurh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="cliph"><rect width="900" height="270" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cliph)">
    <rect width="900" height="270" fill="url(#bgh)"/>
    <g filter="url(#blurh)" opacity=".55">
      <circle cx="135" cy="54" r="94" fill="#1d4ed8">
        <animate attributeName="cx" values="135;315;135" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="765" cy="230" r="86" fill="#7c3aed">
        <animate attributeName="cx" values="765;540;765" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="495" cy="27" r="59" fill="#059669" opacity=".7">
        <animate attributeName="cy" values="27;162;27" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <rect x="1" y="1" width="898" height="268" rx="17" fill="none" stroke="url(#bdh)" stroke-width="1.5" stroke-opacity=".85"/>
  <!-- monogram -->
  <circle class="spin" cx="110" cy="135" r="62" fill="none" stroke="url(#bdh)" stroke-width="2.5" stroke-dasharray="120 40 30 40"/>
  <circle class="spin2" cx="110" cy="135" r="72" fill="none" stroke="#38bdf8" stroke-opacity=".35" stroke-width="1" stroke-dasharray="4 8"/>
  <circle cx="110" cy="135" r="52" fill="#0f172a" stroke="#1e293b"/>
  <text x="110" y="149" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="38" fill="url(#bdh)">AK</text>
  <!-- identity -->
  <g class="type"><text x="210" y="74" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" fill="#94a3b8">@ashfaqkhan111</text></g>
  <rect class="caret" x="342" y="61" width="8" height="16" fill="#38bdf8"/>
  <g class="fade" style="animation-delay:.3s"><text x="208" y="128" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="46" fill="#f8fafc">Ashfaq Khan</text></g>
  <g class="fade" style="animation-delay:.6s"><text x="210" y="160" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#cbd5e1">Building with <tspan fill="#f89820" font-weight="700">Java</tspan> · crafting the web · exploring Linux</text></g>
  
    <g class="chip" style="animation-delay:0.90s">
      <rect x="210" y="186" width="62" height="28" rx="14" fill="#0f172a" stroke="#f89820" stroke-opacity=".7"/>
      <circle cx="222" cy="200" r="4" fill="#f89820"/>
      <text x="231" y="205" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12.5" fill="#e2e8f0">Java</text>
    </g>
    <g class="chip" style="animation-delay:1.05s">
      <rect x="294" y="186" width="54" height="28" rx="14" fill="#0f172a" stroke="#a259ff" stroke-opacity=".7"/>
      <circle cx="306" cy="200" r="4" fill="#a259ff"/>
      <text x="315" y="205" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12.5" fill="#e2e8f0">CSS</text>
    </g>
    <g class="chip" style="animation-delay:1.20s">
      <rect x="370" y="186" width="54" height="28" rx="14" fill="#0f172a" stroke="#8892bf" stroke-opacity=".7"/>
      <circle cx="382" cy="200" r="4" fill="#8892bf"/>
      <text x="391" y="205" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12.5" fill="#e2e8f0">PHP</text>
    </g>
    <g class="chip" style="animation-delay:1.35s">
      <rect x="446" y="186" width="62" height="28" rx="14" fill="#0f172a" stroke="#e34c26" stroke-opacity=".7"/>
      <circle cx="458" cy="200" r="4" fill="#e34c26"/>
      <text x="467" y="205" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12.5" fill="#e2e8f0">HTML</text>
    </g>
    <g class="chip" style="animation-delay:1.50s">
      <rect x="530" y="186" width="70" height="28" rx="14" fill="#0f172a" stroke="#89e051" stroke-opacity=".7"/>
      <circle cx="542" cy="200" r="4" fill="#89e051"/>
      <text x="551" y="205" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12.5" fill="#e2e8f0">Shell</text>
    </g>
  <!-- right badge -->
  <g class="fade" style="animation-delay:1s">
    <circle class="pulse" cx="790" cy="112" r="46" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="790" cy="112" r="36" fill="#0f172a" stroke="#1e293b"/>
    <text x="790" y="121" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#38bdf8">&lt;/&gt;</text>
    <text x="790" y="186" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#94a3b8">OPEN TO COLLAB</text>
    <circle cx="712" cy="182" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>
  <text x="880" y="256" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="10" fill="#475569">github.com/ashfaqkhan111</text>
</svg>