<svg xmlns="http://www.w3.org/2000/svg" width="440" height="170" viewBox="0 0 440 170">
  <style>
    .in { opacity:0; animation: up .7s ease-out 0.60s forwards; }
    @keyframes up { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }
    .ring { stroke-dasharray: 188.5; stroke-dashoffset: 188.5; animation: draw 1.6s ease-out 1.00s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .orbit { transform-origin: 370px 92px; animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
  </style>
  <defs>
    <linearGradient id="bglinux" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="bdlinux" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#a78bfa;#34d399;#38bdf8" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#34d399;#38bdf8;#a78bfa" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="blurlinux" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="cliplinux"><rect width="440" height="170" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cliplinux)">
    <rect width="440" height="170" fill="url(#bglinux)"/>
    <g filter="url(#blurlinux)" opacity=".55">
      <circle cx="66" cy="34" r="59" fill="#1d4ed8">
        <animate attributeName="cx" values="66;154;66" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="374" cy="144" r="54" fill="#7c3aed">
        <animate attributeName="cx" values="374;264;374" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="242" cy="17" r="37" fill="#059669" opacity=".7">
        <animate attributeName="cy" values="17;102;17" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <rect x="1" y="1" width="438" height="168" rx="17" fill="none" stroke="url(#bdlinux)" stroke-width="1.5" stroke-opacity=".85"/>
  <g class="in">
    <text x="20" y="30" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" fill="#64748b">▸ ashfaqkhan111 /</text>
    <circle cx="418" cy="26" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin="0.60s" repeatCount="indefinite"/></circle>
    <line x1="20" y1="42" x2="420" y2="42" stroke="#1e293b"/>
    <text x="20" y="72" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-weight="700" font-size="19" fill="#f1f5f9">linux-projects</text>
    <rect class="caret" x="186" y="58" width="9" height="17" fill="#89e051"/>
    <text x="20" y="98" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8">Shell scripts &amp; Linux experiments</text>
    <rect x="20" y="118" width="60" height="22" rx="11" fill="#0f172a" stroke="#89e051" stroke-opacity=".7"/>
    <text x="30" y="133" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" fill="#e2e8f0">Shell</text>
    <text x="98" y="133" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12" fill="#fbbf24">★ <tspan fill="#cbd5e1">0</tspan></text>
    <text x="140" y="133" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12" fill="#94a3b8">⑂ <tspan fill="#cbd5e1">0</tspan></text>
  </g>
  <circle cx="370" cy="92" r="30" fill="none" stroke="#1e293b" stroke-width="7"/>
  <circle class="ring" cx="370" cy="92" r="30" fill="none" stroke="#89e051" stroke-width="7" stroke-linecap="round" transform="rotate(-90 370 92)"/>
  <g class="orbit"><circle cx="370" cy="52" r="3" fill="#38bdf8"/></g>
  <text x="370" y="97" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#89e051">Shell</text>
</svg>