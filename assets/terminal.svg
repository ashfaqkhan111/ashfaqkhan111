<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <style>
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    .caret { opacity:0; animation: show 0s 6.35s forwards, blink 1s steps(1) 6.35s infinite; }
    @keyframes show { to { opacity:1; } }
    @keyframes blink { 50% { opacity:0; } }
  </style>
  <defs>
    <linearGradient id="bgt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="bdt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#a78bfa;#34d399;#38bdf8" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#34d399;#38bdf8;#a78bfa" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="blurt" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="clipt"><rect width="900" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clipt)">
    <rect width="900" height="300" fill="url(#bgt)"/>
    <g filter="url(#blurt)" opacity=".55">
      <circle cx="135" cy="60" r="105" fill="#1d4ed8">
        <animate attributeName="cx" values="135;315;135" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="765" cy="255" r="96" fill="#7c3aed">
        <animate attributeName="cx" values="765;540;765" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="495" cy="30" r="66" fill="#059669" opacity=".7">
        <animate attributeName="cy" values="30;180;30" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
